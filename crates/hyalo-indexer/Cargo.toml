[package]
name = "hyalo-indexer"
description = "The indexer service: reads the NTFS master file table and follows the USN journal for the hyalo launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
hyalo-core = { path = "../hyalo-core" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Services", "Win32_System_Threading"] }
